<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>
            個人檔案 - GeoTalk
        </title>
        <link rel="stylesheet" href="css/sky.css">
        <link rel="stylesheet" href="css/profile.css">
    </head>
    <body>
        <div id="sky">
            <div id="light"></div>
        </div>
        <div id="header">
            <div id="logo">
                <span id="logo_text">
                    GeoTalk
                </span>
            </div>
        </div>
        <div id="board">
            <div id="banner"></div>
            <div id="avatar"></div>
            <div id="bio">
                <span id="bio_text"></span>
            </div>
            <span id="name"></span>
            <a id="url"></a>
            <span id="sep">
                ____________________________________________________________________________________________________
            </span>
            <div id="email">
                <span id="email_title">
                    EMAIL:&ensp;
                </span>
                <span id="email_text"></span>
            </div>
            <div id="region">
                <span id="region_title">
                    主要活動地區:&ensp;
                </span>
                <span id="region_text"></span>
            </div>
            <div id="birth">
                <span id="birth_title">
                    生日:&ensp;
                </span>
                <span id="birth_text"></span>
            </div>
            <div id="gender">
                <span id="gender_title">
                    性別:&ensp;
                </span>
                <span id="gender_text"></span>
            </div>
        </div>
        <div id="edit">
            <span id="edit_text">
                編輯
            </span>
        </div>
        <div id="error_board">
            <span id="error_text">
                ERROR
            </span>
            <span id="line">
                ____________________________________________________________________________________________________
            </span>
            <span id="error_msg"></span>
        </div>
        <script src="js/sky.js"></script>
        <script src="js/profile.js"></script>
    </body>
</html>
