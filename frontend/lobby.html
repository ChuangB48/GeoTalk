<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>
            大廳 - GeoTalk
        </title>
        <link rel="stylesheet" href="css/sky.css">
        <link rel="stylesheet" href="css/header.css">
        <link rel="stylesheet" href="css/lobby.css">
    </head>
    <body>
        <div id="sky">
            <div id="light"></div>
        </div>
        <div id="header">
            <div id="logo">
                <span id="logo_text">
                    GeoTalk
                </span>
            </div>
            <div id="personal">
                <div id="avatar"></div>
                <div id="username">
                    <span id="username_text"></span>
                </div>
            </div>
        </div>
        <div id="board">
            <div id="map"></div>
            <div id="post_board"></div>
            <div id="article">
                <div id="back">
                    <span id="back_text">
                        &times;
                    </span>
                </div>
                <span id="title"></span>
                <span id="tag"></span>
                <span id="user"></span>
                <span id="content"></span>
            </div>
        </div>
        <div id="post_manage">
            <span id="post_manage_text">
                管理貼文
            </span>
        </div>
        <div id="post">
            <span id="post_text">
                發文
            </span>
        </div>
        <div id="setting">
            <span id="setting_text">
                個人檔案
            </span>
        </div>
        <div id="error_board">
            <span id="error_text">
                ERROR
            </span>
            <span id="line">
                ____________________________________________________________________________________________________
            </span>
            <span id="error_msg"></span>
        </div>
        <script src="js/sky.js"></script>
        <script src="js/header.js"></script>
        <script src="js/lobby.js"></script>
        <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBgHXud4qwezGSDeJAT20BdReZ3TRGK1hs&loading=async&callback=initMap"></script>
    </body>
</html>
