<!DOCTYPE html>
<html>
    <head>
        <title>
            LOGIN
        </title>
        <link rel="stylesheet" href="css/login.css">
    </head>
    <body>
        <div id="board">
            <span id="login_span">
                LOGIN
            </span>
            <span id="username_span">
                username
            </span>
            <input type="text" id="username_input">
            <span id="username_error">
                &times;
            </span>
            <span id="password_span">
                password
            </span>
            <input type="password" id="password_input">
            <img src="images/invisionable.png" id="visionable">
            <span id="password_error">
                &times;
            </span>
            <div id="enter">
                <span id="enter_span">
                    ENTER
                </span>
                <span id="arrow">
                    &rarr;
                </span>
            </div>
            <span id="signup">
                create a new account
            </span>
        </div>
        <div id="error">
            <span id="error_span"></span>
        </div>
        <script src="js/login.js"></script>
    </body>
</html>
