<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>
            登入 - GeoTalk
        </title>
        <link rel="icon" href="images/network.png" type="image/png">
        <link rel="stylesheet" href="css/sky.css">
        <link rel="stylesheet" href="css/login.css">
    </head>
    <body>
        <div id="sky">
            <div id="light"></div>
        </div>
        <div id="board">
            <span id="title">
                LOGIN
            </span>
            <span id="username_text">
                username
            </span>
            <input type="text" id="username_input">
            <span id="username_error">
                &times;
            </span>
            <span id="password_text">
                password
            </span>
            <input type="password" id="password_input">
            <img src="images/invisionable.png" id="visionable">
            <span id="password_error">
                &times;
            </span>
            <div id="enter">
                <span id="enter_text">
                    ENTER
                </span>
                <span id="arrow">
                    &rarr;
                </span>
            </div>
            <span id="signup">
                create a new account
            </span>
        </div>
        <div id="error_board">
            <span id="error_text">
                ERROR
            </span>
            <span id="line">
                ____________________________________________________________________________________________________
            </span>
            <span id="error_msg"></span>
        </div>
        <script src="js/sky.js"></script>
        <script src="js/login.js"></script>
    </body>
</html>
