<!DOCTYPE html>
<html>
    <head>
        <title>
            REGISTER
        </title>
        <link rel="stylesheet" href="css/register.css">
    </head>
    <body>
        <div id="board">
            <span id="register_span">
                REGISTER
            </span>
            <span id="username_span">
                username
            </span>
            <input type="text" id="username_input">
            <span id="username_error">
                &times;
            </span>
            <span id="password_span">
                password
            </span>
            <input type="password" id="password_input">
            <img src="images/invisionable.png" id="visionable">
            <span id="password_error">
                &times;
            </span>
            <span id="confirm_span">
                confirm password
            </span>
            <input type="password" id="confirm_input">
            <img src="images/invisionable.png" id="visionable_confirm">
            <span id="confirm_error">
                &times;
            </span>
            <div id="create">
                <span id="create_span">
                    CREATE
                </span>
                <span id="arrow">
                    &rarr;
                </span>
            </div>
        </div>
        <div id="error">
            <span id="error_span"></span>
        </div>
        <script src="js/register.js"></script>
    </body>
</html>
